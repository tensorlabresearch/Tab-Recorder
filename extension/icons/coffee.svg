<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#e8e2e6"/>
    </linearGradient>
    <linearGradient id="coffee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b4226"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="saucer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0eaee"/>
      <stop offset="100%" stop-color="#c8c0c6"/>
    </linearGradient>
  </defs>

  <!-- Steam -->
  <g fill="none" stroke="#a09098" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
    <path d="M44 20 Q40 14 44 8 Q48 2 44 -4">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M60 20 Q56 14 60 8 Q64 2 60 -4">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M76 20 Q72 14 76 8 Q80 2 76 -4">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Saucer -->
  <ellipse cx="60" cy="106" rx="44" ry="7" fill="url(#saucer)" stroke="#b0a8ae" stroke-width="1"/>

  <!-- Cup body -->
  <path d="M22 40 L98 40 L92 100 Q60 106 28 100 Z" fill="url(#cup)" stroke="#b0a8ae" stroke-width="1.5"/>

  <!-- Handle -->
  <path d="M98 52 Q116 52 116 68 Q116 84 98 84" fill="none" stroke="#b0a8ae" stroke-width="4" stroke-linecap="round"/>

  <!-- Coffee surface -->
  <ellipse cx="60" cy="44" rx="35" ry="6" fill="url(#coffee)"/>
  <ellipse cx="60" cy="43" rx="33" ry="4.5" fill="none" stroke="#8a5e3a" stroke-width="0.8" opacity="0.5"/>

  <!-- Crema highlights -->
  <ellipse cx="50" cy="42" rx="8" ry="2" fill="#a07850" opacity="0.4"/>
  <ellipse cx="70" cy="44" rx="6" ry="1.5" fill="#a07850" opacity="0.3"/>
</svg>
