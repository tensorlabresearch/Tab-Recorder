name: Release Extension

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.1.0)'
        required: true
        default: '1.1.0'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    name: Build Extension ZIP

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zip rsync

      - name: Validate manifest.json
        run: |
          if [[ ! -f "extension/manifest.json" ]]; then
            echo "ERROR: manifest.json not found!"
            exit 1
          fi
          
          # Validate JSON syntax
          jq empty extension/manifest.json
          
          # Extract and validate critical fields
          NAME=$(jq -r '.name' extension/manifest.json)
          VERSION=$(jq -r '.version' extension/manifest.json)
          DESC=$(jq -r '.description' extension/manifest.json)
          MV=$(jq -r '.manifest_version' extension/manifest.json)
          
          if [[ "$NAME" == "null" || -z "$NAME" ]]; then
            echo "ERROR: manifest 'name' is missing"
            exit 1
          fi
          
          if [[ "$VERSION" == "null" || -z "$VERSION" ]]; then
            echo "ERROR: manifest 'version' is missing"
            exit 1
          fi
          
          if [[ "$DESC" == "null" || -z "$DESC" ]]; then
            echo "ERROR: manifest 'description' is missing"
            exit 1
          fi
          
          if [[ "$MV" != "3" ]]; then
            echo "ERROR: Expected manifest_version 3, got $MV"
            exit 1
          fi
          
          echo "✅ Manifest validated: $NAME v$VERSION (MV$MV)"

      - name: Audit for policy violations
        run: |
          echo "=== Auditing for Chrome Web Store policy violations ==="
          
          # Check for remote script loading (CDNs, fetch() to arbitrary URLs)
          # These are red flags for Chrome Web Store review
          RED_FLAGS=0
          
          # Check JS files for fetch() calls (excluding transformers.js bundled third-party code)
          # We exclude lib/transformersJs/ because it's a vendored dependency
          PANEL_SW_FILES=$(find extension -maxdepth 1 -name "*.js" -o -name "panel.js" -o -name "service_worker.js" -o -name "settings.js")
          if grep -rE "fetch\s*\(" $PANEL_SW_FILES 2>/dev/null; then
            echo "⚠️  WARNING: fetch() found in extension JS. Ensure it's only used for allowed origins."
            RED_FLAGS=$((RED_FLAGS + 1))
          fi
          
          # Check for eval() or new Function()
          if grep -rE "eval\s*\(|new\s+Function\s*\(" extension/ --include="*.js" 2>/dev/null; then
            echo "❌ ERROR: eval() or new Function() found — Chrome Web Store will reject this!"
            exit 1
          fi
          
          # Check for inline scripts in HTML
          if grep -rE '<script\s*>[^<]*<' extension/ --include="*.html" 2>/dev/null; then
            echo "❌ ERROR: Inline <script> body content found! Move to external JS modules."
            exit 1
          fi
          
          # Check icons exist
          for SIZE in 16 32 48 128; do
            if [[ ! -f "extension/icons/icon${SIZE}.png" ]]; then
              echo "⚠️  WARNING: Missing icons/icon${SIZE}.png"
              RED_FLAGS=$((RED_FLAGS + 1))
            fi
          done
          
          # Check store assets exist for tagged releases
          if [[ -n "${{ github.ref_name }}" && "${{ github.ref_name }}" == v* ]]; then
            if [[ ! -d "store-assets" ]]; then
              echo "⚠️  WARNING: store-assets/ directory not found. Store listing images will be missing."
              RED_FLAGS=$((RED_FLAGS + 1))
            fi
          fi
          
          echo "=== Audit complete. Red flags: $RED_FLAGS ==="

      - name: Build extension ZIP
        run: |
          VERSION=$(jq -r '.version' extension/manifest.json)
          STAGE_DIR="build/extension-staged"
          ZIP_NAME="tab-recorder-v${VERSION}.zip"
          
          mkdir -p "$STAGE_DIR"
          
          # Copy extension files
          rsync -a --exclude='*.map' --exclude='.DS_Store' --exclude='__MACOSX' \
              extension/ "$STAGE_DIR/"
          
          # Create ZIP from the staged root (not in a subfolder)
          cd "$STAGE_DIR"
          zip -r "../../$ZIP_NAME" . -x "*.map" -x "*.git*"
          cd ../..
          
          # Verify ZIP contents
          echo "=== ZIP contents ==="
          unzip -l "$ZIP_NAME" | tail -5
          echo ""
          
          # Size check (CWS limit is 2GB)
          ZIP_SIZE=$(stat -c%s "$ZIP_NAME")
          if [[ "$ZIP_SIZE" -gt 2147483648 ]]; then
            echo "❌ ERROR: ZIP exceeds 2GB Chrome Web Store limit"
            exit 1
          fi
          
          echo "✅ Built: $ZIP_NAME ($(du -h "$ZIP_NAME" | cut -f1))"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tab-recorder-extension
          path: tab-recorder-*.zip
          retention-days: 90

      - name: Create GitHub Release (tagged pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: tab-recorder-*.zip
          generate_release_notes: true
          body: |
            ## Tab Recorder ${{ github.ref_name }}

            ### Chrome Web Store Submission Package
            - Includes the extension ZIP ready for upload.
            - Manifest v3 compliant.
            - All bundled dependencies included (no remote scripts).

            ### Submission Checklist
            - [ ] Add screenshots and promotional images
            - [ ] Complete privacy practices disclosure
            - [ ] Set category (e.g., Productivity)
            - [ ] Set regions/visibility

            The ZIP is submitted to the Chrome Web Store for review automatically
            by the step below (requires the BPP_KEYS repo secret).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Submit the built zip to the Chrome Web Store for review (tag pushes only).
      # Requires one repo secret, BPP_KEYS, containing a JSON object:
      #   {"chrome": {"extId": "<32-char extension id>",
      #               "clientId": "<oauth client id>",
      #               "clientSecret": "<oauth client secret>",
      #               "refreshToken": "<oauth refresh token>"}}
      # See https://github.com/PlasmoHQ/bpp and
      # https://github.com/PlasmoHQ/chrome-webstore-api/blob/main/token.md
      # Skipped gracefully until the secret exists; the GitHub Release above
      # is still created because it runs first.
      - name: Check BPP_KEYS secret
        id: bpp-keys
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          BPP_KEYS: ${{ secrets.BPP_KEYS }}
        run: |
          if [ -n "$BPP_KEYS" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "set=false" >> "$GITHUB_OUTPUT"
            echo "BPP_KEYS secret not configured — skipping Chrome Web Store submission."
          fi

      # "Response code 400" from bpp is opaque: the Chrome Web Store client
      # throws got's raw HTTPError, and only the upload call suppresses HTTP
      # errors, so a bare status code means the OAuth token refresh or the
      # publish call failed. Exchange the refresh token here first so the log
      # names the actual reason (invalid_grant, invalid_client, ...) instead.
      - name: Verify Chrome Web Store credentials
        id: cws-preflight
        if: startsWith(github.ref, 'refs/tags/v') && steps.bpp-keys.outputs.set == 'true'
        shell: bash
        env:
          BPP_KEYS: ${{ secrets.BPP_KEYS }}
        run: |
          set -euo pipefail

          if ! jq -e . >/dev/null 2>&1 <<<"$BPP_KEYS"; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "reason=BPP_KEYS is not valid JSON." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CLIENT_ID=$(jq -r '.chrome.clientId // empty' <<<"$BPP_KEYS")
          CLIENT_SECRET=$(jq -r '.chrome.clientSecret // empty' <<<"$BPP_KEYS")
          REFRESH_TOKEN=$(jq -r '.chrome.refreshToken // empty' <<<"$BPP_KEYS")

          # GitHub masks the secret as a whole, not the fields parsed out of it.
          for value in "$CLIENT_ID" "$CLIENT_SECRET" "$REFRESH_TOKEN"; do
            if [ -n "$value" ]; then echo "::add-mask::$value"; fi
          done

          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ] || [ -z "$REFRESH_TOKEN" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "reason=BPP_KEYS is missing chrome.clientId, chrome.clientSecret or chrome.refreshToken." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RESPONSE=$(curl -sS -X POST https://www.googleapis.com/oauth2/v4/token \
            -d client_id="$CLIENT_ID" \
            -d client_secret="$CLIENT_SECRET" \
            -d refresh_token="$REFRESH_TOKEN" \
            -d grant_type=refresh_token) || RESPONSE='{"error":"request_failed"}'

          ACCESS_TOKEN=$(jq -r '.access_token // empty' <<<"$RESPONSE")
          if [ -n "$ACCESS_TOKEN" ]; then
            echo "::add-mask::$ACCESS_TOKEN"
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "OAuth refresh succeeded; credentials are live."
            exit 0
          fi

          ERROR=$(jq -r '[.error, .error_description] | map(select(. != null)) | join(": ")' <<<"$RESPONSE" || true)
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "reason=OAuth refresh failed (${ERROR:-unknown error}). Re-mint the token with tools/get-cws-refresh-token.mjs; refresh tokens expire after 7 days while the Google Cloud OAuth app is still in Testing." >> "$GITHUB_OUTPUT"

      - name: Submit to Chrome Web Store
        id: cws-submit
        if: startsWith(github.ref, 'refs/tags/v') && steps.bpp-keys.outputs.set == 'true' && steps.cws-preflight.outputs.ok == 'true'
        continue-on-error: true
        uses: PlasmoHQ/bpp@v3
        with:
          keys: ${{ secrets.BPP_KEYS }}
          # github.ref_name directly: a step's own `env:` is not reliably in
          # scope for that step's `with:`, which left this as "tab-recorder-.zip".
          artifact: tab-recorder-${{ github.ref_name }}.zip
          verbose: true

      # The release itself (tag, zip, GitHub Release) is already done by this
      # point, so a store-submission problem must not paint the whole run red.
      # It surfaces as a warning annotation and a job-summary line instead.
      - name: Report Chrome Web Store outcome
        if: always() && startsWith(github.ref, 'refs/tags/v') && steps.bpp-keys.outputs.set == 'true'
        shell: bash
        env:
          PREFLIGHT_OK: ${{ steps.cws-preflight.outputs.ok }}
          PREFLIGHT_REASON: ${{ steps.cws-preflight.outputs.reason }}
          SUBMIT_OUTCOME: ${{ steps.cws-submit.outcome }}
        run: |
          set -euo pipefail
          if [ "$PREFLIGHT_OK" != "true" ]; then
            echo "::warning title=Chrome Web Store submission skipped::${PREFLIGHT_REASON}"
            echo "### Chrome Web Store: skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "${PREFLIGHT_REASON}" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$SUBMIT_OUTCOME" != "success" ]; then
            echo "::warning title=Chrome Web Store submission failed::Credentials are valid, so the upload or publish call was rejected. See the step log."
            echo "### Chrome Web Store: submission failed" >> "$GITHUB_STEP_SUMMARY"
            echo "Credentials refreshed fine, so the upload or publish call itself was rejected." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Chrome Web Store: submitted for review" >> "$GITHUB_STEP_SUMMARY"
          fi
