name: Auto Release

# On every push to main, parse commits since the last tag, decide whether to
# bump patch/minor/major, update package.json + manifest.json, commit and
# tag, build the extension zip, publish a GitHub Release, and submit the zip
# to the Chrome Web Store for review (via PlasmoHQ/bpp; needs the BPP_KEYS
# repo secret).
# NOTE: the tag push uses GITHUB_TOKEN so it does NOT re-trigger release.yml;
# CWS submission for auto-bumped releases happens in this workflow.
# Manual tag pushes (git push --tags) trigger release.yml instead, which
# performs the same submission.
#
# This workflow triggers automatically AFTER the CI workflow completes
# successfully on the main branch. It will not run on pull requests or
# when CI fails.
#
# Conventional Commits subset used to pick the bump type:
#   feat!:  / fix!: / chore!: / "BREAKING CHANGE" in body  -> major
#   feat:  / feat(scope):                                   -> minor
#   anything else (fix:, chore:, docs:, refactor:, ...)     -> patch
#
# Skips itself on the bump commit it just authored ("chore(release):").

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Check if latest commit is a release bump
        id: skip
        shell: bash
        run: |
          set -euo pipefail
          LATEST_MSG=$(git log -1 --pretty=format:'%s')
          if [[ "$LATEST_MSG" == "chore(release):"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Latest commit is a release bump — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bail if release commit
        if: steps.skip.outputs.skip == 'true'
        run: echo "Skipping release — bump commit detected."

      - uses: actions/setup-node@v7
        if: steps.skip.outputs.skip != 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: steps.skip.outputs.skip != 'true'

      - run: npm test
        if: steps.skip.outputs.skip != 'true'

      - name: Determine bump type
        id: bump
        if: steps.skip.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            RANGE="${LAST_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          COMMITS=$(git log "$RANGE" --pretty=format:'%s%n%b%n----')

          BUMP="patch"
          if printf '%s' "$COMMITS" | grep -qE '^[a-zA-Z]+(\([^)]*\))?!:|^BREAKING CHANGE'; then
            BUMP="major"
          elif printf '%s' "$COMMITS" | grep -qE '^feat(\([^)]*\))?:'; then
            BUMP="minor"
          fi

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
          echo "Bump decision: $BUMP (range ${RANGE})"

      - name: Bump package.json + manifest.json
        id: version
        if: steps.skip.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm version "${{ steps.bump.outputs.bump }}" --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")

          node <<JS
          const fs = require('fs');
          const path = 'extension/manifest.json';
          const m = JSON.parse(fs.readFileSync(path, 'utf8'));
          m.version = '$NEW_VERSION';
          fs.writeFileSync(path, JSON.stringify(m, null, 2) + '\n');
          JS

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_VERSION"

      - name: Commit and tag
        if: steps.skip.outputs.skip != 'true'
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json extension/manifest.json
          git commit -m "chore(release): v${NEW_VERSION}"
          git tag "v${NEW_VERSION}"
          git push origin main --follow-tags

      - name: Package extension
        if: steps.skip.outputs.skip != 'true'
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd extension
          ZIP="../tab-recorder-v${NEW_VERSION}.zip"
          zip -r "$ZIP" . \
            -x 'node_modules/*' \
            -x '.DS_Store' \
            -x '*.md'
          ls -lh "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        if: steps.skip.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: tab-recorder-v${{ steps.version.outputs.version }}.zip
          generate_release_notes: true

      # NOTE: the tag push above uses GITHUB_TOKEN, which does NOT trigger
      # release.yml (GitHub blocks token-triggered workflow runs). So CWS
      # submission for auto-bumped releases must happen here. Manual tag
      # pushes (`git push --tags`) trigger release.yml, which also submits.
      # Both paths guard on the BPP_KEYS secret to avoid failures before
      # it's configured.
      - name: Check BPP_KEYS secret
        id: bpp-keys
        if: steps.skip.outputs.skip != 'true'
        shell: bash
        env:
          BPP_KEYS: ${{ secrets.BPP_KEYS }}
        run: |
          if [ -n "$BPP_KEYS" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "set=false" >> "$GITHUB_OUTPUT"
            echo "BPP_KEYS secret not configured — skipping Chrome Web Store submission."
          fi

      # "Response code 400" from bpp is opaque: the Chrome Web Store client
      # throws got's raw HTTPError, and only the upload call suppresses HTTP
      # errors, so a bare status code means the OAuth token refresh or the
      # publish call failed. Exchange the refresh token here first so the log
      # names the actual reason (invalid_grant, invalid_client, ...) instead.
      - name: Verify Chrome Web Store credentials
        id: cws-preflight
        if: steps.skip.outputs.skip != 'true' && steps.bpp-keys.outputs.set == 'true'
        shell: bash
        env:
          BPP_KEYS: ${{ secrets.BPP_KEYS }}
        run: |
          set -euo pipefail

          if ! jq -e . >/dev/null 2>&1 <<<"$BPP_KEYS"; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "reason=BPP_KEYS is not valid JSON." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CLIENT_ID=$(jq -r '.chrome.clientId // empty' <<<"$BPP_KEYS")
          CLIENT_SECRET=$(jq -r '.chrome.clientSecret // empty' <<<"$BPP_KEYS")
          REFRESH_TOKEN=$(jq -r '.chrome.refreshToken // empty' <<<"$BPP_KEYS")

          # GitHub masks the secret as a whole, not the fields parsed out of it.
          for value in "$CLIENT_ID" "$CLIENT_SECRET" "$REFRESH_TOKEN"; do
            if [ -n "$value" ]; then echo "::add-mask::$value"; fi
          done

          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ] || [ -z "$REFRESH_TOKEN" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "reason=BPP_KEYS is missing chrome.clientId, chrome.clientSecret or chrome.refreshToken." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RESPONSE=$(curl -sS -X POST https://www.googleapis.com/oauth2/v4/token \
            -d client_id="$CLIENT_ID" \
            -d client_secret="$CLIENT_SECRET" \
            -d refresh_token="$REFRESH_TOKEN" \
            -d grant_type=refresh_token) || RESPONSE='{"error":"request_failed"}'

          ACCESS_TOKEN=$(jq -r '.access_token // empty' <<<"$RESPONSE")
          if [ -n "$ACCESS_TOKEN" ]; then
            echo "::add-mask::$ACCESS_TOKEN"
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "OAuth refresh succeeded; credentials are live."
            exit 0
          fi

          ERROR=$(jq -r '[.error, .error_description] | map(select(. != null)) | join(": ")' <<<"$RESPONSE" || true)
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "reason=OAuth refresh failed (${ERROR:-unknown error}). Re-mint the token with tools/get-cws-refresh-token.mjs; refresh tokens expire after 7 days while the Google Cloud OAuth app is still in Testing." >> "$GITHUB_OUTPUT"

      - name: Submit to Chrome Web Store
        id: cws-submit
        if: steps.skip.outputs.skip != 'true' && steps.bpp-keys.outputs.set == 'true' && steps.cws-preflight.outputs.ok == 'true'
        continue-on-error: true
        uses: PlasmoHQ/bpp@v3
        with:
          keys: ${{ secrets.BPP_KEYS }}
          artifact: tab-recorder-v${{ steps.version.outputs.version }}.zip
          verbose: true

      # The release itself (tag, zip, GitHub Release) is already done by this
      # point, so a store-submission problem must not paint the whole run red.
      # It surfaces as a warning annotation and a job-summary line instead.
      - name: Report Chrome Web Store outcome
        if: always() && steps.skip.outputs.skip != 'true' && steps.bpp-keys.outputs.set == 'true'
        shell: bash
        env:
          PREFLIGHT_OK: ${{ steps.cws-preflight.outputs.ok }}
          PREFLIGHT_REASON: ${{ steps.cws-preflight.outputs.reason }}
          SUBMIT_OUTCOME: ${{ steps.cws-submit.outcome }}
        run: |
          set -euo pipefail
          if [ "$PREFLIGHT_OK" != "true" ]; then
            echo "::warning title=Chrome Web Store submission skipped::${PREFLIGHT_REASON}"
            echo "### Chrome Web Store: skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "${PREFLIGHT_REASON}" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$SUBMIT_OUTCOME" != "success" ]; then
            echo "::warning title=Chrome Web Store submission failed::Credentials are valid, so the upload or publish call was rejected. See the step log."
            echo "### Chrome Web Store: submission failed" >> "$GITHUB_STEP_SUMMARY"
            echo "Credentials refreshed fine, so the upload or publish call itself was rejected." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Chrome Web Store: submitted for review" >> "$GITHUB_STEP_SUMMARY"
          fi
